<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anotate - Vuelapelucas 3000</title>
    <meta name="description" content="Formulario de inscripción Vuelapelucas 3000 - Espectador, feriante, artista de escenario, VJ, instalación multimedia o colaborador.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=5">
    <link rel="stylesheet" href="css/vuelapelucas2026.css?v=4">
</head>
<body>
    <main class="anotate-page">
        <div class="anotate-header">
            <div class="brand">VUELAPELUCAS <span>3000</span></div>
            <a class="back-link" href="index.html">← Volver al sitio</a>
        </div>

        <div class="container">
            <h2 class="section-title">¡ANOTATE YA!</h2>
            <p class="section-subtitle">Elegí cómo te sumás al festival y contanos lo que necesitás</p>

            <form id="form-inscripcion" class="inscripcion-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre *</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido *</label>
                        <input type="text" id="apellido" name="apellido" required placeholder="Tu apellido">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" name="telefono" placeholder="2954-123456">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="ciudad">Ciudad</label>
                        <input type="text" id="ciudad" name="ciudad" placeholder="¿De dónde venís?">
                    </div>
                </div>

                <div class="form-row single">
                    <div class="form-group">
                        <label for="rol">¿Cómo te sumás? *</label>
                        <select id="rol" name="rol" required>
                            <option value="">-- Seleccionar --</option>
                            <option value="espectador">Espectador</option>
                            <option value="feriante">Feriante</option>
                            <option value="artista_escenario">Artista de escenario</option>
                            <option value="vj">VJ</option>
                            <option value="instalacion_multimedia">Instalación multimedia</option>
                            <option value="colaborador_productor">Colaborador / productor</option>
                        </select>
                    </div>
                </div>

                <div class="form-row" data-row="colaborar" hidden>
                    <div class="form-group">
                        <label for="como_colaborar">¿Cómo querés colaborar?</label>
                        <textarea id="como_colaborar" name="como_colaborar" rows="3" placeholder="Contanos qué te gustaría aportar al festival"></textarea>
                    </div>
                </div>

                <div class="form-row single" data-row="tecnicas" hidden>
                    <div class="form-group">
                        <label for="especificaciones_tecnicas">Especificaciones técnicas <span class="label-hint">(feriante, artista de escenario, VJ o instalación multimedia)</span></label>
                        <textarea id="especificaciones_tecnicas" name="especificaciones_tecnicas" rows="4" placeholder="Sonido, luces, proyector, pantalla, electricidad, espacio, medida del stand, etc."></textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="hospedaje">¿Dónde te vas a hospedar?</label>
                        <select id="hospedaje" name="hospedaje">
                            <option value="">-- Seleccionar --</option>
                            <option value="camping">Camping (Club Banco Nación / Los Pisaderos)</option>
                            <option value="hotel">Hotel</option>
                            <option value="cabanas">Cabañas</option>
                            <option value="particular">Alojamiento particular</option>
                            <option value="aun_no_se">Aún no sé</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-submit">¡INSCRIBIRME!</button>
            </form>
            <div id="form-message" class="form-message"></div>
        </div>
    </main>

    <!-- BOTON FLOTANTE: GRUPO DE WHATSAPP -->

       target="_blank" rel="noopener" aria-label="Sumate al grupo de WhatsApp de Vuelapelucas 3000"
       title="Sumate al grupo de WhatsApp">

    <script src="js/background-shader.js?v=2"></script>
    <script src="js/inscripcion-form.js?v=3"></script>
    <script>
        window.InscripcionForm.init({ formId: 'form-inscripcion', messageId: 'form-message' });
    </script>
</body>
</html>
