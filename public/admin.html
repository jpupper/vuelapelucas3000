<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Vuelapelucas 3000</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- estilos base del sitio: mismas variables, tipografias y estetica -->
    <link rel="stylesheet" href="css/styles.css?v=5">
    <style>
        /* =========================================================
           ADMIN — misma estetica que la pagina principal:
           contenedores BLANCOS, stroke negro 3px, sombra dura,
           tipografia Bebas Neue + Inter, acento amarillo pop.
           ========================================================= */

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: transparent;
            color: #000000;
            min-height: 100vh;
            padding: 0 0 5rem;
        }

        #vuelapelucas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -10;
            pointer-events: none;
            display: block;
        }

        .admin-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2.2rem 1.6rem 0;
        }

        /* ---------- BARRA SUPERIOR (misma que anotate/hospedajes) ---------- */
        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 1.1rem 2rem;
            background: #ffffff;
            border: 3px solid #000000;
            border-radius: 50px;
            box-shadow: 6px 6px 0px #000000;
            margin-bottom: 2.5rem;
        }

        .admin-header .brand {
            font-family: 'Bebas Neue', cursive;
            font-size: 2rem;
            letter-spacing: 0.05em;
            color: #000000;
            line-height: 1;
        }

        .admin-header .brand b { color: var(--tertiary, #ef4720); }

        .admin-header .admin-tag {
            font-family: 'Bebas Neue', cursive;
            font-size: 1.25rem;
            letter-spacing: 0.14em;
            color: #000000;
            background: var(--secondary, #ffd62c);
            border: 2px solid #000000;
            border-radius: 50px;
            padding: 0.3rem 1.2rem;
            box-shadow: 3px 3px 0px #000000;
        }

        .admin-header .back-link {
            color: #000000;
            font-weight: 800;
            font-size: 0.95rem;
            text-decoration: none;
            border: 2px solid #000000;
            background: #ffffff;
            border-radius: 50px;
            padding: 0.55rem 1.4rem;
            box-shadow: 3px 3px 0px #000000;
            transition: all 0.15s ease;
        }

        .admin-header .back-link:hover {
            background: var(--secondary, #ffd62c);
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #000000;
        }

        /* ---------- CONTENEDOR BLANCO GENERICO ---------- */
        .admin-card {
            background: #ffffff;
            color: #000000;
            border: 3px solid #000000;
            border-radius: 24px;
            box-shadow: 8px 8px 0px #000000;
            padding: 2.5rem 2.2rem;
        }

        /* ---------- LOGIN ---------- */
        .login-card {
            max-width: 460px;
            margin: 4rem auto 0;
            text-align: center;
            padding: 3rem 2.5rem;
        }

        .login-card h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: 3rem;
            letter-spacing: 0.04em;
            color: #000000;
            margin-bottom: 0.3rem;
            line-height: 1;
        }

        .login-card .subtitle {
            color: #444444;
            font-weight: 600;
            margin-bottom: 2rem;
        }

        .login-card input {
            width: 100%;
            background: #f8f9fa;
            border: 2px solid #000000;
            border-radius: 12px;
            padding: 0.95rem 1.1rem;
            color: #000000;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            box-shadow: 3px 3px 0px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
        }

        .login-card input::placeholder { color: #888888; }

        .login-card input:focus {
            outline: none;
            background: #ffffff;
            box-shadow: 4px 4px 0px #000000;
        }

        .login-card button {
            width: 100%;
            margin-top: 1.2rem;
            background: var(--secondary, #ffd62c);
            color: #000000;
            font-family: 'Bebas Neue', cursive;
            font-size: 1.8rem;
            letter-spacing: 0.05em;
            padding: 0.9rem;
            border: 3px solid #000000;
            border-radius: 50px;
            box-shadow: 5px 5px 0px #000000;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .login-card button:hover {
            background: #ffde47;
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px #000000;
        }

        .login-card button:active {
            transform: translate(2px, 2px);
            box-shadow: 3px 3px 0px #000000;
        }

        /* ---------- CABECERA DEL PANEL ---------- */
        .panel-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .panel-head h1 {
            font-family: 'Bebas Neue', cursive;
            font-size: clamp(2.4rem, 5vw, 3.4rem);
            letter-spacing: 0.04em;
            color: #000000;
            line-height: 1;
            margin-bottom: 0.25rem;
        }

        .panel-head .subtitle { color: #444444; font-weight: 600; }

        /* ---------- BARRA DE ACCIONES ---------- */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            font-family: 'Bebas Neue', cursive;
            font-size: 1.25rem;
            letter-spacing: 0.06em;
            background: #ffffff;
            color: #000000;
            border: 3px solid #000000;
            border-radius: 999px;
            padding: 0.5rem 1.5rem;
            box-shadow: 4px 4px 0px #000000;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        .toolbar-btn:hover {
            background: var(--secondary, #ffd62c);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
        }

        .toolbar-btn:active { transform: translate(1px, 1px); box-shadow: 3px 3px 0px #000000; }

        .toolbar-btn.csv {
            background: var(--green, #04ba65);
            color: #ffffff;
        }

        .toolbar-btn.csv:hover { background: #05a95a; }

        .toolbar-btn.csv:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0px #000000; }

        /* ---------- STATS ---------- */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
            justify-items: start;
        }

        .stat-card {
            background: #ffffff;
            color: #000000;
            width: 100%;
            max-width: 320px;
            padding: 1.8rem 1.6rem;
            border: 3px solid #000000;
            border-radius: 20px;
            box-shadow: 7px 7px 0px #000000;
            text-align: center;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .stat-card:hover { transform: translate(-3px, -3px); box-shadow: 10px 10px 0px #000000; }

        .stat-number {
            font-family: 'Bebas Neue', cursive;
            font-size: 3.6rem;
            line-height: 1;
            color: var(--tertiary, #ef4720);
        }

        .stat-label {
            color: #333333;
            font-weight: 800;
            letter-spacing: 0.05em;
            margin-top: 0.4rem;
        }

        /* ---------- TABLA ---------- */
        .table-container {
            background: #ffffff;
            border: 3px solid #000000;
            border-radius: 20px;
            box-shadow: 8px 8px 0px #000000;
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
        }

        table { width: 100%; border-collapse: collapse; }

        th, td { padding: 0.9rem 1rem; text-align: left; vertical-align: top; }

        th {
            background: var(--secondary, #ffd62c);
            color: #000000;
            font-family: 'Bebas Neue', cursive;
            font-size: 1.15rem;
            letter-spacing: 0.06em;
            font-weight: 400;
            white-space: nowrap;
            border-bottom: 3px solid #000000;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        td {
            border-bottom: 1px solid #e6e6e6;
            color: #111111;
            font-weight: 500;
        }

        tbody tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fffbe8; }

        .col-lg { min-width: 200px; max-width: 320px; white-space: pre-wrap; word-break: break-word; }
        .col-md { min-width: 130px; white-space: nowrap; }
        .col-sm { min-width: 90px; white-space: nowrap; }

        /* Columna de accion fija a la derecha (no se va con el scroll) */
        th.col-accion, td.col-accion {
            position: sticky;
            right: 0;
            min-width: 96px;
            text-align: center;
            background: #ffffff;
            box-shadow: -8px 0 12px -8px rgba(0, 0, 0, 0.35);
        }

        th.col-accion { background: var(--secondary, #ffd62c); z-index: 3; }
        tr:hover td.col-accion { background: #fffbe8; }

        .delete-btn {
            background: var(--tertiary, #ef4720);
            color: #ffffff;
            border: 2px solid #000000;
            border-radius: 8px;
            padding: 0.45rem 0.85rem;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000000;
            transition: all 0.15s ease;
        }

        .delete-btn:hover {
            background: #d63c17;
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #000000;
        }

        .badge-rol {
            display: inline-block;
            padding: 0.25rem 0.7rem;
            border-radius: 50px;
            background: var(--secondary, #ffd62c);
            border: 2px solid #000000;
            box-shadow: 2px 2px 0px #000000;
            color: #000000;
            font-size: 0.85rem;
            font-weight: 800;
            white-space: nowrap;
        }

        .loading, .sin-datos {
            text-align: center;
            padding: 2.5rem;
            color: #444444;
            font-weight: 600;
        }

        .error {
            text-align: center;
            padding: 2rem;
            color: var(--tertiary, #ef4720);
            font-weight: 800;
        }

        @media (max-width: 768px) {
            .admin-page { padding: 1.2rem 1rem 0; }
            .admin-header { border-radius: 24px; justify-content: center; text-align: center; }
            .admin-card { padding: 1.8rem 1.4rem; }
            .panel-head { justify-content: center; text-align: center; }
            .login-card { margin-top: 1.5rem; padding: 2.2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="admin-page">
        <header class="admin-header">
            <span class="brand">VUELAPELUCAS <b>3000</b></span>
            <span class="admin-tag">PANEL DE ADMINISTRACIÓN</span>
            <a class="back-link" href="index.html">← VOLVER AL SITIO</a>
        </header>

        <div class="admin-container">
            <div id="login-section" class="admin-card login-card">
                <h1>🔐 Admin</h1>
                <p class="subtitle">Vuelapelucas 3000 - Panel de Administración</p>
                <input type="password" id="admin-pass" placeholder="Contraseña de administrador">
                <button onclick="login()">Ingresar</button>
            </div>

            <div id="admin-section" style="display: none;">
                <div class="admin-card panel-head">
                    <div>
                        <h1>📊 Panel de Administración</h1>
                        <p class="subtitle">Vuelapelucas 3000 - Inscripciones</p>
                    </div>
                    <div class="toolbar">
                        <button class="toolbar-btn csv" id="btn-csv" onclick="exportarCSV()">⬇️ Exportar CSV</button>
                        <button class="toolbar-btn" onclick="logout()">Cerrar Sesión</button>
                    </div>
                </div>

                <div class="stats" id="stats"></div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th class="col-md">Nombre</th>
                                <th class="col-md">Apellido</th>
                                <th class="col-lg">Email</th>
                                <th class="col-sm">Teléfono</th>
                                <th class="col-sm">Ciudad</th>
                                <th class="col-md">Rol</th>
                                <th class="col-lg">Cómo colabora</th>
                                <th class="col-lg">Espec. técnicas</th>
                                <th class="col-sm">Hospedaje</th>
                                <th class="col-sm">Fecha</th>
                                <th class="col-accion">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="inscripciones-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            BASE: '/vuelapelucas3000_2',
            API_URL: (() => {
                const IS_NODE_SERVER = (
                    location.hostname === 'localhost' ||
                    location.hostname === '127.0.0.1' ||
                    location.host.includes('localhost') ||
                    location.hostname === 'vps-4455523-x.dattaweb.com'
                );
                return IS_NODE_SERVER ? '' : 'https://vps-4455523-x.dattaweb.com';
            })()
        };

        let adminPass = '';
        let ultimasInscripciones = [];

        const ROLES = {
            espectador: 'Espectador',
            feriante: 'Feriante',
            artista_escenario: 'Artista de escenario',
            vj: 'VJ',
            instalacion_multimedia: 'Instalación multimedia',
            colaborador_productor: 'Colaborador / productor'
        };

        const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));

        const nombreRol = (r) => ROLES[r] || r || 'Espectador';

        async function login() {
            adminPass = document.getElementById('admin-pass').value;
            await loadInscripciones();
        }

        function logout() {
            adminPass = '';
            ultimasInscripciones = [];
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('admin-section').style.display = 'none';
            document.getElementById('admin-pass').value = '';
        }

        function fechaCorta(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            return isNaN(d) ? '-' : d.toLocaleDateString('es-AR');
        }

        async function loadInscripciones() {
            try {
                const url = CONFIG.API_URL + CONFIG.BASE + '/api/inscripciones?pass=' + encodeURIComponent(adminPass);
                const response = await fetch(url, { credentials: 'include' });
                const data = await response.json();

                if (!response.ok) {
                    alert('Contraseña incorrecta');
                    return;
                }

                ultimasInscripciones = data.inscripciones || [];

                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-section').style.display = 'block';

                // Stats
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-number">${data.count}</div>
                        <div class="stat-label">Total Inscriptos</div>
                    </div>
                `;

                // Tabla
                const tbody = document.getElementById('inscripciones-body');
                if (!ultimasInscripciones.length) {
                    tbody.innerHTML = '<tr><td class="sin-datos" colspan="11">Todavía no hay inscripciones</td></tr>';
                } else {
                    tbody.innerHTML = ultimasInscripciones.map(i => `
                        <tr>
                            <td class="col-md">${esc(i.nombre)}</td>
                            <td class="col-md">${esc(i.apellido)}</td>
                            <td class="col-lg">${esc(i.email)}</td>
                            <td class="col-sm">${esc(i.telefono) || '-'}</td>
                            <td class="col-sm">${esc(i.ciudad) || '-'}</td>
                            <td class="col-md"><span class="badge-rol">${esc(nombreRol(i.rol))}</span></td>
                            <td class="col-lg">${esc(i.como_colaborar) || '-'}</td>
                            <td class="col-lg">${esc(i.especificaciones_tecnicas) || '-'}</td>
                            <td class="col-sm">${esc(i.hospedaje) || '-'}</td>
                            <td class="col-sm">${fechaCorta(i.createdAt)}</td>
                            <td class="col-accion"><button class="delete-btn" onclick="deleteInscripcion('${i._id}')" title="Eliminar inscripción">🗑️</button></td>
                        </tr>
                    `).join('');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al cargar inscripciones');
            }
        }

        async function deleteInscripcion(id) {
            if (!confirm('¿Eliminar esta inscripción?')) return;

            try {
                const url = CONFIG.API_URL + CONFIG.BASE + '/api/inscripciones/' + id + '?pass=' + encodeURIComponent(adminPass);
                await fetch(url, { method: 'DELETE', credentials: 'include' });
                await loadInscripciones();
            } catch (error) {
                alert('Error al eliminar');
            }
        }

        // --- EXPORTAR CSV ---
        // Separador ";" y BOM UTF-8 para que Excel en español lo abra en columnas.
        function celdaCSV(valor) {
            const s = String(valor == null ? '' : valor).replace(/\r?\n/g, ' ').replace(/"/g, '""');
            return '"' + s + '"';
        }

        function exportarCSV() {
            if (!ultimasInscripciones.length) {
                alert('No hay datos para exportar. Cargá las inscripciones primero.');
                return;
            }

            const columnas = [
                ['Nombre', i => i.nombre],
                ['Apellido', i => i.apellido],
                ['Email', i => i.email],
                ['Telefono', i => i.telefono],
                ['Ciudad', i => i.ciudad],
                ['Rol', i => nombreRol(i.rol)],
                ['Como colabora', i => i.como_colaborar],
                ['Especificaciones tecnicas', i => i.especificaciones_tecnicas],
                ['Hospedaje', i => i.hospedaje],
                ['Fecha', i => fechaCorta(i.createdAt)],
                ['Fecha ISO', i => i.createdAt]
            ];

            const lineas = [columnas.map(c => celdaCSV(c[0])).join(';')];
            ultimasInscripciones.forEach(i => {
                lineas.push(columnas.map(c => celdaCSV(c[1](i))).join(';'));
            });

            const csv = '\ufeff' + lineas.join('\r\n') + '\r\n';
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const hoy = new Date().toISOString().slice(0, 10);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `vuelapelucas3000_inscripciones_${hoy}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        }

        // Enter en el campo de contraseña = ingresar
        document.getElementById('admin-pass').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
    <script src="js/background-shader.js?v=2"></script>
</body>
</html>
